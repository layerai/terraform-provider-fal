// The subset of fal's IsolateController service that this provider calls.
//
// Copied from controller.proto in the isolate-proto Python package (0.34.5,
// https://pypi.org/project/isolate-proto/), which the fal CLI talks to. Only the
// secret and environment RPCs are kept; the package, service, message names and
// field numbers are unchanged, so the wire format matches the full service.
//
// Regenerate with `make generate-proto`.
syntax = "proto3";

import "google/protobuf/timestamp.proto";

package controller;

option go_package = "github.com/fal-ai/terraform-provider-fal/internal/isolate";

service IsolateController {
    // Set a secret, or delete it when no value is given.
    rpc SetSecret (SetSecretRequest) returns (SetSecretResponse) {}
    // List the secrets of an environment (names only, never values).
    rpc ListSecrets (ListSecretsRequest) returns (ListSecretsResponse) {}
    rpc ListEnvironments (ListEnvironmentsRequest) returns (ListEnvironmentsResponse) {}
    rpc CreateEnvironment (CreateEnvironmentRequest) returns (CreateEnvironmentResponse) {}
    rpc DeleteEnvironment (DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse) {}
}

message SetSecretRequest {
    string name = 1;
    optional string value = 2;
    // Target environment (defaults to "main")
    optional string environment_name = 3;
    // Whether the secret is exposed to apps that do not explicitly list
    // their secrets. When unset, the account-level default applies.
    optional bool default_exposed = 4;
}

message SetSecretResponse {
    // Empty. For future use.
}

message ListSecretsRequest {
    // Filter by environment (defaults to "main")
    optional string environment_name = 1;
}

message ListSecretsResponse {
    repeated Secret secrets = 1;
}

message Secret {
    string name = 1;
    optional google.protobuf.Timestamp created_time = 2;
    optional string environment_name = 3;
    // Whether the secret is exposed to apps that do not explicitly list
    // their secrets. Unset means the account-level default applies.
    optional bool default_exposed = 4;
}

message ListEnvironmentsRequest {
    // Empty. For future use.
}

message ListEnvironmentsResponse {
    repeated EnvironmentInfo environments = 1;
}

message CreateEnvironmentRequest {
    string name = 1;
    optional string description = 2;
}

message CreateEnvironmentResponse {
    EnvironmentInfo environment = 1;
}

message DeleteEnvironmentRequest {
    string name = 1;
}

message DeleteEnvironmentResponse {
    // Empty. For future use.
}

message EnvironmentInfo {
    string name = 1;
    optional string description = 2;
    bool is_default = 3;
    google.protobuf.Timestamp created_at = 4;
}
